<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Edil Bingos</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    html, body { background: #141824; color: #ffffff; height: 100%; overflow-x: hidden; user-select: none; }
    body { padding: 12px; }
    .top-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .top-stats.four { grid-template-columns: repeat(4, 1fr); }
    .stat-box { background: #1f2436; border-radius: 10px; padding: 8px 4px; text-align: center; border: 1px solid #2c334a; }
    .stat-label { font-size: 11px; color: #9ca3af; margin-bottom: 4px; }
    .stat-val { font-size: 18px; font-weight: bold; }
    .green { color: #22c55e; }
    .red { color: #ef4444; }
    .gold { color: #f59e0b; }
    .pink { color: #ec4899; }

    .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .auto-box { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .auto-label { font-size: 12px; color: #d1d5db; }
    .switch { position: relative; width: 46px; height: 24px; background: #374151; border-radius: 20px; cursor: pointer; transition: 0.3s; }
    .switch.on { background: #22c55e; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: 0.3s; }
    .switch.on::after { left: 25px; }

    .stake-wrap { flex: 1; }
    .min-max { text-align: center; font-size: 11px; color: #9ca3af; margin-bottom: 4px; }
    .stake-bar { display: flex; align-items: center; justify-content: space-between; background: #1f2436; border: 1px solid #2c334a; border-radius: 10px; padding: 6px 12px; }
    .stake-btn { background: none; border: none; color: #fff; font-size: 20px; font-weight: bold; padding: 0 10px; cursor: pointer; }
    .stake-title { font-size: 13px; color: #9ca3af; }
    .stake-num { font-size: 16px; font-weight: bold; }

    .banner-text { text-align: center; color: #f59e0b; font-weight: bold; font-size: 14px; margin: 10px 0 4px; }
    .sub-title { text-align: center; font-size: 15px; font-weight: bold; margin-bottom: 12px; }

    .cartela-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; max-width: 420px; margin: 0 auto; padding-bottom: 20px; }
    .c-ball { aspect-ratio: 1; border-radius: 50%; background: #4b5563; color: #fff; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid transparent; }
    .c-ball.taken { background: #f87171; color: #1f2436; pointer-events: none; }
    .c-ball.selected { background: #22c55e; color: #fff; border-color: #fff; }

    #gameScreen { display: none; }
    .game-layout { display: grid; grid-template-columns: 1.05fr 1fr; gap: 10px; align-items: start; }
    .board-75 { background: #1a1f2e; padding: 6px; border-radius: 10px; }
    .b-headers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 6px; }
    .b-head { aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: #fff; }
    .bg-b { background: #d97706; } .bg-i { background: #16a34a; } .bg-n { background: #2563eb; } .bg-g { background: #dc2626; } .bg-o { background: #9333ea; }
    .b-nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .b-cell { aspect-ratio: 1; border-radius: 50%; background: #2d3448; color: #9ca3af; font-size: 10px; display: flex; align-items: center; justify-content: center; }
    .b-cell.called { background: #f59e0b; color: #111827; font-weight: bold; }

    .right-panel { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .caller-circle { width: 105px; height: 105px; border-radius: 50%; background: #3b3528; border: 4px solid #f59e0b; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: #f59e0b; box-shadow: 0 0 15px rgba(245,158,11,0.3); }

    .player-card { width: 100%; background: #1f2436; padding: 6px; border-radius: 10px; border: 1px solid #2c334a; }
    .card-id { text-align: center; font-size: 11px; color: #9ca3af; margin-bottom: 4px; }
    .p-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
    .p-head { text-align: center; font-weight: bold; font-size: 12px; padding: 4px 0; border-radius: 4px; color: #fff; }
    .p-cell { aspect-ratio: 1; background: #2d3448; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; }
    .p-cell.marked, .p-cell.free { background: #22c55e; color: #fff; }
    .bingo-btn { width: 100%; margin-top: 10px; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(90deg, #f59e0b, #ea580c); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }

    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-card { background: #ffffff; color: #111827; border-radius: 16px; padding: 20px; width: 100%; max-width: 340px; text-align: center; }
    .modal-title { font-size: 22px; font-weight: bold; margin-bottom: 6px; }
    .modal-sub { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
    .winner-name { font-size: 15px; font-weight: bold; margin-bottom: 12px; }
    .win-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; max-width: 210px; margin: 0 auto 14px; background: #1f2937; padding: 3px; border-radius: 6px; }
    .w-head { background: #f97316; color: #fff; font-weight: bold; font-size: 12px; padding: 5px 0; }
    .w-cell { background: #1f2937; color: #fff; font-size: 12px; font-weight: bold; padding: 6px 0; }
    .w-cell.win-line { background: #10b981; color: #fff; }
    .redirect-txt { font-size: 12px; color: #4b5563; }
  </style>
</head>
<body>

  <div id="lobbyScreen">
    <div class="top-stats">
      <div class="stat-box"><div class="stat-label">ተጫዋቾች</div><div class="stat-val green" id="lobbyPlayers">38</div></div>
      <div class="stat-box"><div class="stat-label">ሊጀምር ነው</div><div class="stat-val red" id="lobbyTimer">15s</div></div>
      <div class="stat-box"><div class="stat-label">ቀሪ ሒሳብ</div><div class="stat-val gold" id="userBalance">100</div></div>
    </div>

    <div class="controls-row">
      <div class="auto-box">
        <span class="auto-label">አውቶማቲክ</span>
        <div class="switch on" id="autoSwitch" onclick="toggleAuto()"></div>
      </div>
      <div class="stake-wrap">
        <div class="min-max">ትንሹ: 10 &nbsp;&nbsp; ትልቁ: 50</div>
        <div class="stake-bar">
          <span class="stake-title">ምድብ</span>
          <button class="stake-btn" onclick="changeStake(-10)">−</button>
          <span class="stake-num" id="stakeVal">10</span>
          <button class="stake-btn" onclick="changeStake(10)">+</button>
        </div>
      </div>
    </div>

    <div class="banner-text">ጨዋታው በሁለት ዝግ ነው!</div>
    <div class="sub-title">የካርቴላ ቁጥር ይምረጡ</div>
    <div class="cartela-grid" id="cartelaGrid"></div>
  </div>

  <div id="gameScreen">
    <div class="top-stats four">
      <div class="stat-box"><div class="stat-label">ተጫዋቾች</div><div class="stat-val green" id="gamePlayers">38</div></div>
      <div class="stat-box"><div class="stat-label">ምድብ</div><div class="stat-val" id="gameStake">10</div></div>
      <div class="stat-box"><div class="stat-label">ደራሽ</div><div class="stat-val gold" id="gamePot">304</div></div>
      <div class="stat-box"><div class="stat-label">የተጠራ</div><div class="stat-val pink" id="calledCount">0</div></div>
    </div>

    <div class="game-layout">
      <div class="board-75">
        <div class="b-headers">
          <div class="b-head bg-b">B</div><div class="b-head bg-i">I</div><div class="b-head bg-n">N</div><div class="b-head bg-g">G</div><div class="b-head bg-o">O</div>
        </div>
        <div class="b-nums" id="board75"></div>
      </div>

      <div class="right-panel">
        <div class="caller-circle" id="currentCall">--</div>
        <div class="player-card">
          <div class="card-id" id="chosenCardLabel">ካርቴላ #401</div>
          <div class="p-grid" id="playerCardGrid"></div>
        </div>
        <button class="bingo-btn" onclick="claimBingo()">🎉 BINGO!</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="winnerModal">
    <div class="modal-card">
      <div class="modal-title">Game Completed</div>
      <div class="modal-sub">New game will start soon, you will be redirected to the lobby.</div>
      <div class="winner-name" id="winnerText">አሸናፊ (401) has won the game.</div>
      <div class="win-grid" id="winnerCardGrid"></div>
      <div class="redirect-txt" id="redirectCountdown">Redirecting to the Lobby in 5 seconds...</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.expand(); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }

    let balance = 100;
    let stake = 10;
    let autoMark = true;
    let selectedCartela = 401;
    let lobbySeconds = 15;
    let lobbyInterval, callInterval;
    let calledNumbers = [];
    let myCard = [];
    const takenCartelas = new Set([412, 428, 460, 465, 474, 475, 494]);

    function initLobby() {
      const grid = document.getElementById('cartelaGrid');
      grid.innerHTML = '';
      for (let i = 401; i <= 500; i++) {
        const div = document.createElement('div');
        div.className = 'c-ball' + (takenCartelas.has(i) ? ' taken' : '') + (i === selectedCartela ? ' selected' : '');
